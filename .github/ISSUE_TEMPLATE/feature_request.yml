name: 💡 Feature request
description: Suggest a tool or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "I keep having to … because …"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: checkboxes
    id: constraint
    attributes:
      label: Design constraint
      options:
        - label: This can work without sending the document to a server
          required: true
