name: 🐛 Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Please do not attach a confidential PDF** — reproduce the problem
        with a document you are happy to share publicly.
  - type: input
    id: tool
    attributes:
      label: Which tool?
      placeholder: e.g. Redact, Merge, PDF Editor
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Load a PDF with …
        3. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 128 on macOS 15
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Anything red in the browser console
      render: shell
